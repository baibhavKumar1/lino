name: lino
description: "Lino - Modern Grocery Shopping List Companion & Intelligent Kitchen Management for Android."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  http: ^1.2.0
  postgres: ^3.1.2
  url_launcher: ^6.2.5
  image_picker: ^1.1.2
  google_sign_in: ^6.2.1
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  very_good_analysis: ^5.1.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#F8FAFC"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - logo.jpg
  # PREVIOUS LOCAL FONTS - COMMENTED OUT AS PER RULE TO UNIFY ON POPPINS
  # fonts:
  #   - family: Funnel Display
  #     fonts:
  #       - asset: assets/fonts/FunnelDisplay.ttf
